[project]
name = "otter-agent"
dynamic = ["version"]  # 2026-09-29 P1:版本单源=otter/__init__.py 的 __version__(tool.setuptools.dynamic 声明处取值)
description = "Otter — 轻量本地通用 AI 助手:编码/文件/命令/网页/日常,OpenAI 兼容 + Anthropic 原生,双层记忆与 Skill"
readme = "README.md"
license = "MIT"  # 2026-09-29 P7:SPDX 表达式(旧 classifier 写法已被打包工具弃用提示)
license-files = ["LICENSE"]
authors = [{ name = "Zzz777-coder" }]
keywords = ["agent", "coding-agent", "cli", "llm", "deepseek", "anthropic", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",      # 模型接入:DeepSeek/OpenAI 走同一兼容协议(说明书选型:不用 litellm,减少抽象层)
    "aiosqlite>=0.20",   # 事件态持久化(messages/runs/events/conversations 表)
    "rich>=13.0",        # TUI 渲染(markdown/工具调用面板)
    "mcp>=1.0",          # M4:MCP 客户端(stdio)
    "fpdf2>=2.8",        # 2026-09-24 R6:make_pdf 原生生成真 PDF(纯 Python,防伪造二进制交付)
    "httpx2>=2",         # 2026-09-24 Anthropic 原生 adapter 的 HTTP/SSE 层(openai 3.x 同源依赖)
    "tiktoken>=0.7",     # 2026-09-24 发布冒烟暴露:context/estimator 硬 import 却未声明(干净 venv 装完启动即崩)
    "sqlite-vec>=0.1.6", # 2026-09-29 P5:RAG 向量列(vec0 虚拟表);加载失败自动降级纯词法
]

[project.urls]
Homepage = "https://github.com/Zzz777-coder/otter"
Issues = "https://github.com/Zzz777-coder/otter/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.115"]  # 2026-09-29 httpx+fastapi:TestClient 测试 API 层用
gui = [
    "pywebview>=5",      # M4 起 GUI 为可选 extras:pip install otter-agent[gui]
    "pillow>=10",
]
server = [
    "fastapi>=0.115",    # 2026-09-29 R1:本地 HTTP API(otter --serve)
    "uvicorn>=0.30",
]

[project.scripts]
otter = "otter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 2026-09-29 P1:版本号唯一来源=otter/__init__.py 的 __version__,改版只改那一处
[tool.setuptools.dynamic]
version = { attr = "otter.__version__" }

[tool.setuptools.packages.find]
include = ["otter*"]

# 修复(2026-09-22):GUI 的 web 静态资源必须随包分发——此前未声明 package-data,
# 非 editable 安装的副本缺 index.html/style.css/app.js/marked.min.js → GUI 404
[tool.setuptools.package-data]
otter = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
