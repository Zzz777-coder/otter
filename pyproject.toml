[project]
name = "otter-agent"
version = "0.2.0"  # 2026-09-24 首发:R6-R14(make_pdf/记忆页/交付物页/徽标/stream-json/Anthropic adapter/Skill 注入)
description = "Otter — 轻量级 Python CLI 编码 Agent(OpenAI 兼容 + Anthropic 原生;双层记忆/Plan-Act/Skill/GUI)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zzz777-coder" }]
keywords = ["agent", "coding-agent", "cli", "llm", "deepseek", "anthropic", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",      # 模型接入:DeepSeek/OpenAI 走同一兼容协议(说明书选型:不用 litellm,减少抽象层)
    "aiosqlite>=0.20",   # 事件态持久化(messages/runs/events/conversations 表)
    "rich>=13.0",        # TUI 渲染(markdown/工具调用面板)
    "mcp>=1.0",          # M4:MCP 客户端(stdio)
    "fpdf2>=2.8",        # 2026-09-24 R6:make_pdf 原生生成真 PDF(纯 Python,防伪造二进制交付)
    "httpx2>=2",         # 2026-09-24 Anthropic 原生 adapter 的 HTTP/SSE 层(openai 3.x 同源依赖)
    "tiktoken>=0.7",     # 2026-09-24 发布冒烟暴露:context/estimator 硬 import 却未声明(干净 venv 装完启动即崩)
]

[project.urls]
Homepage = "https://github.com/Zzz777-coder/otter"
Issues = "https://github.com/Zzz777-coder/otter/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = [
    "pywebview>=5",      # M4 起 GUI 为可选 extras:pip install otter-agent[gui]
    "pillow>=10",
]

[project.scripts]
otter = "otter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["otter*"]

# 修复(2026-09-22):GUI 的 web 静态资源必须随包分发——此前未声明 package-data,
# 非 editable 安装的副本缺 index.html/style.css/app.js/marked.min.js → GUI 404
[tool.setuptools.package-data]
otter = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
